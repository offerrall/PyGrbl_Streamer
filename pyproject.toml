[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrbl-streamer"
version = "1.0.3"
description = "Stream G-code to GRBL controllers over serial, with progress, pause/resume/stop and configurable connections."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Beltrán Offerrall" },
]
keywords = ["grbl", "gcode", "cnc", "laser", "serial", "streaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://offerrall.github.io/pygrbl-streamer/"
Documentation = "https://offerrall.github.io/pygrbl-streamer/"
Repository = "https://github.com/offerrall/PyGrbl_Streamer"
Issues = "https://github.com/offerrall/PyGrbl_Streamer/issues"
Changelog = "https://github.com/offerrall/PyGrbl_Streamer/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pygrbl_streamer"]

[tool.setuptools.package-data]
pygrbl_streamer = ["py.typed"]
